name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  analyze:
    name: 静态分析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart analyze

  arch-guard:
    name: 架构守护（领域层禁 UI 依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run tools/check_architecture.dart

  test:
    name: 单元与组件测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Install sqlite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: dart test packages/domain
      - run: dart test packages/player
      - run: dart test packages/storage
      - run: dart test packages/plugins
      - run: dart test packages/lan
      - run: flutter test packages/ui_kit
      - run: flutter test apps/desktop
